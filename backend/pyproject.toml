[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raildoc-backend"
version = "1.0.0"
description = "Railway maintenance block planning and scheduling backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "ortools>=9.8.3296",
    "ultralytics>=8.4.0",          # 8.4.0 is the first release with YOLO26 models
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "PyYAML>=6.0",
    "numpy>=1.26.2",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "alembic>=1.12.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]